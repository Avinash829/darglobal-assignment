# Render's free plan sleeps after 15 minutes without traffic.
# Pinging the health endpoint every 10 minutes keeps the demo instantly available.
name: Keep demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://darglobal-assignment-829.onrender.com/api/health
